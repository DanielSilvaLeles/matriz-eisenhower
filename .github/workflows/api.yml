name: API (VPS)

# Testa a API (api/) contra um Postgres 15 de verdade e, só no repositório
# que optou por isso, publica na VPS: SSH → git pull → docker compose build
# → up. O front (GitHub Pages) continua no deploy.yml, sem relação com este.
on:
  push:
    branches: [main, master]
    paths: ['api/**', 'apps-script/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'apps-script/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testar:
    name: Testes da API e do proxy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: matriz
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: matriz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matriz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://matriz:teste@localhost:5432/matriz_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Raiz também: test/checksum.test.ts importa o checksum do front
      # (src/domain), que depende do zod da raiz.
      - run: npm ci
      - run: npm ci --prefix api

      - name: Testes da API (Postgres real)
        run: npm test --prefix api

      # Code.gs de verdade (VM) → API de verdade → Postgres: sobe a API em
      # segundo plano num banco separado e roda o harness do proxy ponta a ponta.
      - name: Proxy do Apps Script ponta a ponta
        run: |
          PGPASSWORD=teste psql -h localhost -U matriz -d matriz_test -c "CREATE DATABASE matriz_e2e"
          KEY=$(openssl rand -hex 32)
          DATABASE_URL=postgres://matriz:teste@localhost:5432/matriz_e2e MATRIZ_API_KEY=$KEY PORT=5002 \
            node api/src/server.ts > api-e2e.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5002/matriz/health && break; sleep 1; done
          PROXY_E2E_API_URL=http://127.0.0.1:5002/matriz PROXY_E2E_API_KEY=$KEY node apps-script/test/proxy.mjs
          cat api-e2e.log

  publicar:
    name: Publicar na VPS
    needs: testar
    # Só publica onde a variável do repositório VPS_DEPLOY = 'true' foi
    # definida (Settings → Secrets and variables → Actions → Variables). Um
    # repositório sem a variável (ex.: uma cópia de teste) roda os testes e
    # para aqui.
    if: github.event_name != 'pull_request' && vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REPO_DIR: /home/apps/${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_IP" \
            "REPO_DIR='$REPO_DIR' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REPO_DIR"
          git fetch --quiet origin "$BRANCH"
          git checkout --quiet "$BRANCH"
          git pull --ff-only --quiet origin "$BRANCH"
          cd /home/apps
          # Só o serviço da matriz - nenhum outro container é reconstruído/reiniciado.
          docker compose build matriz-api
          docker compose up -d --no-deps matriz-api
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5002/matriz/health >/dev/null; then echo "matriz-api no ar"; exit 0; fi
            sleep 2
          done
          echo "matriz-api não respondeu ao /health:"; docker logs --tail 50 matriz-api; exit 1
          REMOTE
