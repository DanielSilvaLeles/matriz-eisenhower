# Para COLAR dentro do bloco `server { ... }` que já atende api.leles.tec.br
# (o de `listen 443 ssl`), em /etc/nginx/sites-available/<arquivo-do-api>.
# Não mexe nas outras rotas do mesmo host.

location /matriz/ {
    # Sem URI no proxy_pass: o caminho chega inteiro (/matriz/...), que é o
    # BASE_PATH que a API espera.
    proxy_pass http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # O push manda o documento inteiro (hoje ~150 KB; a API aceita até 4 MB).
    client_max_body_size 5m;
}
