# SÓ se api.leles.tec.br ainda NÃO existir no Nginx. Salve como
# /etc/nginx/sites-available/api.leles.tec.br, ative e rode o Certbot:
#
#   sudo ln -s /etc/nginx/sites-available/api.leles.tec.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.leles.tec.br
#
# O Certbot acrescenta sozinho o bloco 443 + redirect; depois disso, confira
# que o `location /matriz/` ficou dentro do bloco 443.

server {
    listen 80;
    listen [::]:80;
    server_name api.leles.tec.br;

    location /matriz/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5m;
    }
}
