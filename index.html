<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Matriz de Eisenhower</title>
    <meta name="description" content="App pessoal de priorização com a Matriz de Eisenhower." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1013" />
    <script>
      /*
       * Aplica o tema antes da primeira pintura, para o tema escuro não piscar
       * branco no carregamento. É a única duplicação da lógica de src/ui/theme.ts,
       * e ela existe porque precisa rodar antes do React. Mantenha as duas em
       * sincronia: "light" e "dark" são explícitos, qualquer outro valor segue
       * o sistema.
       */
      try {
        var pref = localStorage.getItem('matriz:tema')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (error) {
        /* Armazenamento bloqueado: segue o tema claro. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
